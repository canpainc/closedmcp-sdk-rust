[package]
name = "closedmcp-sdk"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
autoexamples = false
license = "Apache-2.0"
repository = "https://github.com/canpainc/closedmcp-sdk-rust"
homepage = "https://github.com/canpainc/closedmcp-sdk-rust"
description = "ClosedMCP authorization for rmcp Streamable HTTP servers"

[workspace]

[dependencies]
axum = "0.8"
base64 = "0.22"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net"] }
url = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "time"] }

[[bin]]
name = "hello-template"
path = "examples/hello-template.rs"
